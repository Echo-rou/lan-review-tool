<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="30" y="28" font-size="20" font-weight="bold" fill="#111827">提审 · 审核 · 交付 工作流程</text>

  <!-- A: 创作者提交 -->
  <g>
    <rect x="30" y="70" width="170" height="65" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="115" y="98" text-anchor="middle" font-size="14" fill="#1e3a8a" font-weight="bold">创作者提交作品</text>
    <text x="115" y="118" text-anchor="middle" font-size="11" fill="#1e3a8a">创作者电脑 · 浏览器</text>
  </g>

  <!-- B: 审核 -->
  <g>
    <rect x="250" y="70" width="190" height="65" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="345" y="98" text-anchor="middle" font-size="14" fill="#312e81" font-weight="bold">审核：查看 + 评论</text>
    <text x="345" y="118" text-anchor="middle" font-size="11" fill="#312e81">手机 / 笔记本浏览器</text>
  </g>

  <!-- Diamond: 需要修改? -->
  <g>
    <polygon points="520,102 590,70 660,102 590,134" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
    <text x="590" y="106" text-anchor="middle" font-size="13" fill="#713f12" font-weight="bold">需要修改?</text>
  </g>

  <!-- C: 通过 -->
  <g>
    <rect x="710" y="55" width="160" height="55" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="790" y="80" text-anchor="middle" font-size="14" fill="#14532d" font-weight="bold">审核通过</text>
    <text x="790" y="98" text-anchor="middle" font-size="11" fill="#14532d">历史快照留存</text>
  </g>

  <!-- D: 交付 -->
  <g>
    <rect x="710" y="200" width="160" height="60" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="790" y="228" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="bold">正式交付</text>
    <text x="790" y="246" text-anchor="middle" font-size="11" fill="#7f1d1d">接收电脑</text>
  </g>

  <!-- E: 修改再提交 -->
  <g>
    <rect x="250" y="200" width="190" height="60" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
    <text x="345" y="228" text-anchor="middle" font-size="14" fill="#7c2d12" font-weight="bold">创作者修改再提交</text>
    <text x="345" y="246" text-anchor="middle" font-size="11" fill="#7c2d12">进入下一轮审核</text>
  </g>

  <!-- Arrows -->
  <path d="M200 102 H250" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M440 102 H495" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M660 88 H710" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="682" y="80" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="bold">否 / 通过</text>
  <path d="M790 110 V200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M590 134 V215 H440" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="512" y="215" text-anchor="middle" font-size="11" fill="#ea580c" font-weight="bold">是 / 需修改</text>
  <!-- loop back: E -> B -->
  <path d="M345 200 V150" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="360" y="172" font-size="11" fill="#64748b">循环</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="30" y="320" font-size="12" fill="#6b7280">全流程在同一局域网内完成：不依赖公网 · 无需注册账号 · 无付费服务</text>
</svg>
